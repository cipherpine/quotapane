# cargo-deny policy — gated in CI on every PR (SECURITY.md, supply-chain policy).
# The dependency tree is intentionally tiny; every crate is justified in
# CONTRIBUTING.md. Loosening any section below is a security-relevant change.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Ignored advisories require a written justification and re-review whenever
# the dependency path changes.
ignore = [
    # Both quick-xml advisories are DoS-class (quadratic CPU / unbounded
    # allocation when parsing UNTRUSTED XML). In this workspace quick-xml
    # exists only inside `wayland-scanner`, a BUILD-TIME proc-macro that
    # parses the vendored Wayland protocol XML shipped inside the crates —
    # trusted input, never runtime data, and absent entirely from the
    # Windows (primary) target. No patched compatible version exists yet;
    # remove these when wayland-scanner updates.
    { id = "RUSTSEC-2026-0194", reason = "build-time only (wayland-scanner), trusted vendored XML, DoS-class" },
    { id = "RUSTSEC-2026-0195", reason = "build-time only (wayland-scanner), trusted vendored XML, DoS-class" },
]

[licenses]
version = 2
# Every license here is permissive; additions must be reviewed.
# ISC / BSD-3-Clause / CDLA-Permissive-2.0 entered with the M1 TLS stack
# (ureq → rustls → ring/webpki; CDLA covers the Mozilla root-cert data in
# webpki-roots). "Apache-2.0 AND ISC" (ring) is satisfied by the two entries.
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    # Unicode-3.0: `unicode-ident`, pulled by serde_derive's proc-macro tree
    # (syn). Permissive; the standard license for Unicode data tables.
    "Unicode-3.0",
    # The four below entered with the M2 egui/eframe UI tree (usage-ui only —
    # the trust boundary crate does not depend on any of this):
    # Zlib: small utility crates in the winit/graphics stack. Permissive.
    "Zlib",
    # BSL-1.0 (Boost): permissive, not to be confused with BUSL.
    "BSL-1.0",
    # OFL-1.1 + Ubuntu-font-1.0: the fonts embedded by epaint_default_fonts.
    # Standard font licenses; permissive for embedding/distribution.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal workspace path-dependencies are exempt from the wildcard ban;
# registry dependencies must always pin a version.
allow-wildcard-paths = true
# Telemetry/analytics crates must never appear (SECURITY.md invariant 4).
# Logger BACKENDS are also banned: the `log` facade enters transitively via
# ureq (which redacts sensitive headers behind an allowlist — verified at
# v3.3.0, src/util.rs NON_SENSITIVE_HEADERS), but as defense in depth no
# QuotaPane binary may ever install a log consumer. With no backend linked,
# every log macro in every dependency is a no-op — nothing can reach disk
# or console. Removing a ban here is a breaking security change.
deny = [
    { crate = "sentry" },
    { crate = "posthog-rs" },
    { crate = "segment" },
    { crate = "rudderanalytics" },
    { crate = "opentelemetry-otlp" },
    { crate = "env_logger" },
    { crate = "simple_logger" },
    { crate = "simplelog" },
    { crate = "fern" },
    { crate = "flexi_logger" },
    { crate = "log4rs" },
    { crate = "tracing-subscriber" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
