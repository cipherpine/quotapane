[package]
name = "usage-ui"
description = "QuotaPane always-on-top desktop window (egui). Pure render — holds no credential logic."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false # distributed as a signed binary, not on crates.io

# The shipped executable is `quotapane` (D2/D3, 2026-07-26): the product name
# is QuotaPane, while the crate name stays product-neutral.
[[bin]]
name = "quotapane"
path = "src/main.rs"

[dependencies]
# eframe (M2): the window. Trimmed features — glow renderer only (no wgpu),
# default fonts, X11+Wayland on Linux. This tree is large but lives entirely
# OUTSIDE the trust boundary: usage-ui receives only non-secret snapshots.
# See CONTRIBUTING.md for the justification row.
eframe = { version = "0.36.1", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
usage-core = { path = "../usage-core" }

# tray-icon (M3.5): system tray on Windows (primary) + macOS only. Reviewed at
# the top tier 2026-07-20 (corrected 2026-07-23) — see the full analysis in
# prompts/m3.5-tray-dependency-review.md and the CONTRIBUTING.md row.
# Lockfile delta is 9 crates: 5 that compile here (tray-icon, muda,
# crossbeam-channel, crossbeam-utils, keyboard-types, all MIT/Apache) + 4
# PHANTOM crates pulled only through tray-icon's Linux/BSD-gated `dirs` dep
# (dirs, dirs-sys, redox_users, and option-ext which is MPL-2.0). The target
# gate below makes that chain compile on none of our targets; option-ext's
# MPL-2.0 is handled by a narrow per-crate exception in deny.toml.
# Deliberately NO `gtk` feature and NO Linux target: the Linux backend would
# pull the officially-unmaintained gtk-rs 0.18 bindings + libappindicator.
# Linux stays window-only in v1 (future gtk-free option: ksni, own review).
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.24", default-features = false }
