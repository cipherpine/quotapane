[package]
name = "usage-ui"
description = "QuotaPane always-on-top desktop window (egui). Pure render — holds no credential logic."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false # distributed as a signed binary, not on crates.io

[dependencies]
# eframe (M2): the window. Trimmed features — glow renderer only (no wgpu),
# default fonts, X11+Wayland on Linux. This tree is large but lives entirely
# OUTSIDE the trust boundary: usage-ui receives only non-secret snapshots.
# See CONTRIBUTING.md for the justification row.
eframe = { version = "0.35.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
usage-core = { path = "../usage-core" }
